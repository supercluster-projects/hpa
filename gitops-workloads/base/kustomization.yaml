  app.kubernetes.io/part-of: hpa-platform
  app.kubernetes.io/components: hpa-workloads

commonAnnotations:
  argocd.argoproj.io/sync-options: Prune=false,Validate=true

# Namespace configuration - applied to all resources
namespace: hpa-workloads