apiVersion: apps/v1
kind: Deployment
metadata:
  name: casbin-ext-authz
  namespace: casbin
  labels:
    app.kubernetes.io/name: casbin-ext-authz
    app.kubernetes.io/instance: casbin-service
    app.kubernetes.io/component: authorizer
    app.kubernetes.io/part-of: hpa-platform
    app.kubernetes.io/managed-by: argocd
spec:
  replicas: 1
  selector:
    matchLabels:
      app: casbin-ext-authz
  template:
    metadata:
      labels:
        app: casbin-ext-authz
        app.kubernetes.io/name: casbin-ext-authz
        app.kubernetes.io/instance: casbin-service
        app.kubernetes.io/component: authorizer
        app.kubernetes.io/part-of: hpa-platform
    spec:
      containers:
        - name: casbin-ext-authz
          image: harbor.harbor.svc.cluster.local/library/hpa-workloads/casbin-ext-authz:latest
          command:
            - /casbin-ext-authz
            - -model
            - /etc/casbin/casbin_model.conf
            - -policy
            - /etc/casbin/casbin_policy.csv
          ports:
            - containerPort: 9001
              name: grpc
              protocol: TCP
          volumeMounts:
            - name: casbin-config
              mountPath: /etc/casbin
          envFrom:
            - secretRef:
                name: casbin-infisical-secrets
                optional: true
          resources:
            limits:
              memory: "256Mi"
              cpu: "250m"
            requests:
              memory: "128Mi"
              cpu: "100m"
          # Liveness probe - check if process is running
          livenessProbe:
            grpc:
              port: 9001
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          # Readiness probe - check if ready to accept traffic
          readinessProbe:
            exec:
              command:
                - /bin/grpc_health_probe
                - -addr=:9001
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
      volumes:
        - name: casbin-config
          configMap:
            name: casbin-config
