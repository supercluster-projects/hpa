apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: welcome
  labels:
    app.kubernetes.io/name: welcome
    app.kubernetes.io/instance: welcome-service
    app.kubernetes.io/component: function
    app.kubernetes.io/part-of: hpa-platform
    app.kubernetes.io/managed-by: argocd
  annotations:
    serving.knative.dev/creator: hpa-platform
spec:
  template:
    metadata:
      annotations:
        autoscaling.knative.dev/min-scale: "1"
        autoscaling.knative.dev/max-scale: "10"
        # Health check probe configuration
        run.googleapis.com/health-check-path: /health
        run.googleapis.com/health-check-port: 8080
        run.googleapis.com/health-check-interval: 10s
        run.googleapis.com/health-check-timeout: 5s
        run.googleapis.com/health-check-period: 30s
    spec:
      containers:
        - image: ${HARBOR_SERVICE}/library/hpa-workloads/welcome:latest
          ports:
            - containerPort: 8080
          env:
            - name: COUNTER_ADDR
              value: "http://counter.hpa-workloads.svc.cluster.local:8080"
          envFrom:
            - secretRef:
                name: welcome-infisical-secrets
                optional: true
          # Resource requests and limits for Knative
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
