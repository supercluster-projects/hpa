apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: welcome
  labels:
    app.kubernetes.io/name: welcome
    app.kubernetes.io/instance: welcome-service
    app.kubernetes.io/component: function
    app.kubernetes.io/part-of: hpa-platform
    app.kubernetes.io/managed-by: argocd
  annotations:
    serving.knative.dev/creator: hpa-platform
spec:
  template:
    metadata:
      annotations:
        autoscaling.knative.dev/min-scale: "1"
        autoscaling.knative.dev/max-scale: "10"
    spec:
      containers:
        - image: ${HARBOR_SERVICE}/library/hpa-workloads/welcome:latest
          ports:
            - containerPort: 8080
          env:
            - name: COUNTER_ADDR
              value: "http://counter.hpa-workloads.svc.cluster.local:8080"
          envFrom:
            - secretRef:
                name: welcome-infisical-secrets
                optional: true
      # Resource requests and limits for Knative
      # Note: Knative uses container-level resources, not pod-level
