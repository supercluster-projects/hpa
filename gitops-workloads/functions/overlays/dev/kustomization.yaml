apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - functions
  - spins
  - secrets.yaml

# Apply common labels and namespace
namespace: hpa-workloads

commonLabels:
  app.kubernetes.io/managed-by: argocd
  app.kubernetes.io/part-of: hpa-platform
  app.kubernetes.io/component: welcome-function
  app.kubernetes.io/version: v1.0.0

commonAnnotations:
  argocd.argoproj.io/sync-options: Prune=false
  maintainers: |
    Vladimir Cores <vladimir.cores@gmail.com>
