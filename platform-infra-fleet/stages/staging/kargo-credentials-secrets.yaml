# Declarative Kargo Credential Store Config (M2 Task M2.1.2)
apiVersion: v1
kind: Secret
metadata:
  name: kargo-git-credentials
  namespace: kargo
  labels:
    kargo.akuity.io/credential-type: git
type: Opaque
stringData:
  # Repo URL or prefix that this credential applies to
  repoURL: https://github.com/your-org
  username: platform-robot
  password: <github-personal-access-token>
---
apiVersion: v1
kind: Secret
metadata:
  name: kargo-harbor-credentials
  namespace: kargo
  labels:
    kargo.akuity.io/credential-type: oci
type: Opaque
stringData:
  # OCI registry prefix (Harbor)
  repoURL: harbor.harbor.svc.cluster.local
  username: robot$platform-deployer
  password: <harbor-robot-token>
