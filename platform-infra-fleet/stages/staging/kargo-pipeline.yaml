apiVersion: kargo.akuity.io/v1alpha1
kind: Warehouse
metadata:
  name: fleet-warehouse
  namespace: kargo
spec:
  subscriptions:
    - image:
        repoURL: harbor.harbor.svc.cluster.local/library/hpa-workloads
        imageSelectionStrategy: SemVer
  freightCreationPolicy: Automatic
---
apiVersion: kargo.akuity.io/v1alpha1
kind: Stage
metadata:
  name: dev
  namespace: kargo
spec:
  requestedFreight:
    - warehouse: fleet-warehouse
  promotionMechanisms:
    gitByAndCommit:
      - repoURL: https://github.com/your-org/platform-infra-fleet.git
        writeBranch: dev
        helm:
          - chart: platform-fleet
            valuesFile: stages/dev/values.yaml
            imageKey: image.tag
    argoCD:
      # Forces Kargo to trigger and wait for Argo CD sync status (M2 Task M2.3.3)
      - apps:
          - name: platform-fleet-dev
            namespace: argocd
---
apiVersion: kargo.akuity.io/v1alpha1
kind: Stage
metadata:
  name: staging
  namespace: kargo
spec:
  requestedFreight:
    - warehouse: fleet-warehouse
      stages:
        - dev
  # Enables automated promotion policy from dev to staging (M2 Task M2.3.1)
  promotionPolicy: Automatic
  promotionMechanisms:
    gitByAndCommit:
      - repoURL: https://github.com/your-org/platform-infra-fleet.git
        writeBranch: staging
        helm:
          - chart: platform-fleet
            valuesFile: stages/staging/values.yaml
            imageKey: image.tag
    argoCD:
      # Sync status polling & health verification (M2 Task M2.3.3)
      - apps:
          - name: platform-fleet-staging
            namespace: argocd
---
apiVersion: kargo.akuity.io/v1alpha1
kind: Stage
metadata:
  name: production
  namespace: kargo
spec:
  requestedFreight:
    - warehouse: fleet-warehouse
      stages:
        - staging
  promotionMechanisms:
    gitByAndCommit:
      - repoURL: https://github.com/your-org/platform-infra-fleet.git
        writeBranch: main
        helm:
          - chart: platform-fleet
            valuesFile: stages/production/values.yaml
            imageKey: image.tag
    argoCD:
      - apps:
          - name: platform-fleet-production
            namespace: argocd
