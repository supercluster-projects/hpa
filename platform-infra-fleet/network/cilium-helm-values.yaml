# Standardized Cilium Helm Values for Spoke Nodes (M4 Task M4.2.1)
# Enforces high-performance kube-proxy-free mode across all environments

kubeProxyReplacement: "true"
k8sServiceHost: "192.168.122.100"
k8sServicePort: "6443"

# IPAM configuration
ipam:
  mode: "kubernetes"

# LoadBalancer integration
loadBalancer:
  l2:
    enabled: true
  externalIPs:
    enabled: true
