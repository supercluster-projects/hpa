# Backstage Deployment, Persistence, and OIDC Auth Config (M3 Task M3.1.2 & M3.1.3)
apiVersion: v1
kind: Namespace
metadata:
  name: backstage
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: backstage-config
  namespace: backstage
data:
  app-config.production.yaml: |
    app:
      title: HPA Enterprise Developer Portal
      baseUrl: http://backstage.internal

    backend:
      baseUrl: http://backstage.internal
      database:
        client: pg
        connection:
          host: backstage-db
          port: 5432
          user: postgres
          password: ${POSTGRES_PASSWORD}

    auth:
      # Casdoor OIDC SSO Authentication Integration (M3 Task M3.1.3)
      providers:
        oidc:
          production:
            clientId: ${CASDOOR_OIDC_CLIENT_ID}
            clientSecret: ${CASDOOR_OIDC_CLIENT_SECRET}
            metadataUrl: http://casdoor.gateway.svc.cluster.local/.well-known/openid-configuration
            authorizationUrl: http://casdoor.gateway.svc.cluster.local/login/oauth/authorize
            tokenUrl: http://casdoor.gateway.svc.cluster.local/api/login/oauth/access_token
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: backstage-db
  namespace: backstage
spec:
  serviceName: backstage-db
  replicas: 1
  selector:
    matchLabels:
      app: backstage-db
  template:
    metadata:
      matchLabels:
        app: backstage-db
      labels:
        app: backstage-db
    spec:
      containers:
        - name: postgres
          image: postgres:15-alpine
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_DB
              value: backstage_catalog
            - name: POSTGRES_PASSWORD
              value: backstagepass
  volumeClaimTemplates:
    - metadata:
        name: db-data
      spec:
        accessModes: [ "ReadWriteOnce" ]
        resources:
          requests:
            storage: 10Gi
---
apiVersion: v1
kind: Service
metadata:
  name: backstage-db
  namespace: backstage
spec:
  ports:
    - port: 5432
  selector:
    app: backstage-db
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backstage
  namespace: backstage
spec:
  replicas: 2
  selector:
    matchLabels:
      app: backstage
  template:
    metadata:
      labels:
        app: backstage
    spec:
      containers:
        - name: backstage
          image: harbor.harbor.svc.cluster.local/library/backstage:custom-v1.0
          ports:
            - containerPort: 7007
          env:
            - name: POSTGRES_PASSWORD
              value: backstagepass
            - name: CASDOOR_OIDC_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: backstage-auth-secrets
                  key: oidc-client-id
            - name: CASDOOR_OIDC_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: backstage-auth-secrets
                  key: oidc-client-secret
          volumeMounts:
            - name: config-volume
              mountPath: /app/app-config.production.yaml
              subPath: app-config.production.yaml
      volumes:
        - name: config-volume
          configMap:
            name: backstage-config
---
apiVersion: v1
kind: Service
metadata:
  name: backstage
  namespace: backstage
spec:
  ports:
    - port: 7007
      targetPort: 7007
  selector:
    app: backstage
