# Application Dynamic ExternalSecret Mapping (M4 Task M4.1.3)
apiVersion: secrets.infisical.com/v1alpha1
kind: InfisicalExternalSecret
metadata:
  name: app-database-credentials
  namespace: hpa-workloads
spec:
  secretStoreRef:
    name: infisical-spoke-store
    kind: InfisicalSecretStore
  # Refers to the path where secrets reside inside Infisical Vault
  secretsPath: "/database"
  # Target Kubernetes secret to generate dynamically (M4 Task M4.1.3)
  target:
    name: app-db-credentials
    creationPolicy: Owner
