# Infisical Spoke SecretStore configuration (M4 Task M4.1.2)
apiVersion: secrets.infisical.com/v1alpha1
kind: InfisicalSecretStore
metadata:
  name: infisical-spoke-store
  namespace: hpa-workloads
spec:
  # The central Hub Infisical Vault API Endpoint
  hostAPI: http://infisical.infisical.svc.cluster.local:8080
  authentication:
    # Machine Identity Universal Auth authentication mapping (M4 Task M4.1.2)
    universalAuth:
      credentialsSecret:
        name: infisical-spoke-credentials
        namespace: hpa-workloads
      secretsScope:
        projectSlug: hpa-workloads-dev
        environmentSlug: dev
